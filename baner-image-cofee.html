<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.baner-cofee-main-44-d345{
    width: 100%;
    max-width: 1300px;
    margin: 0px auto;
    overflow-x: hidden;
    background-color: #3d0c11;
}
.baner-cofee-inner-44-d345{
    width: 100%;
}
.baner-cofee-baner-image-flex-44-d345{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 80px 60px;
}
.baner-text-4jei-d345{
    width: 50%;
}
.baner-heading-d345 h2{
    font-family: cursive;
    color: #e08a1e;
    font-size: 32px;
    margin: 0px 0px 16px 0px;
    font-weight: 600;
}
.baner-span-d345 span{
    font-family: sans-serif;
    color: #ffffff;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.3;
    display: block;
    margin-bottom: 18px;
}
.baner-para-disc-d345 p{
    font-family: sans-serif;
    color: #cccccc;
    font-size: 15px;
    line-height: 1.7;
    margin: 0px 0px 32px 0px;
    max-width: 380px;
}
.baner-button-j43j-d345{
    display: flex;
    align-items: center;
    gap: 16px;
}
.button-d345 a{
    background-color: #e08a1e;
    color:  #ffffff;
    text-decoration: none;
    font-family: sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 30px;
    display: inline-block;
    transition: background 0.2s;
}
.button-d345 a:hover{
    background-color: #c97a10;
}
.button-irih-d345 a{
    background-color: transparent;
    color: #ffffff;
    text-decoration: none;
    font-family: sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 11px 28px;
    border-radius: 30px;
    border: 2px solid #ffffff;
    display: inline-block;
    transition: background 0.2s, color 0.2s;
}
.button-irih-d345 a:hover{
    background-color: #c97a10;
    color: #3d0c11;
}
.baner-image-erh-d345{
    width: 45%;
    display: flex;
    justify-content: center;
    align-items: center;
}
.baner-image-erh-d345 img{
    width: 100%;
    max-width: 480px;
    object-fit: contain;
}


/* ========== 1024px ========== */
@media (max-width: 1024px){
    .baner-cofee-baner-image-flex-44-d345{
        padding: 60px 30px;
    }
    .baner-text-4jei-d345{
        width: 52%;
    }
    .baner-image-erh-d345{
        width: 44%;
    }
    .baner-heading-d345 h2{
        font-size: 28px;
    }
    .baner-span-d345 span{
        font-size: 28px;
    }
    .baner-para-disc-d345 p{
        font-size: 14px;
    }
}


/* ========== 768px ========== */
@media (max-width: 768px){
    .baner-cofee-baner-image-flex-44-d345{
        flex-direction: column;
        padding: 50px 20px;
        text-align: center;
    }
    .baner-text-4jei-d345{
        width: 100%;
    }
    .baner-image-erh-d345{
        width: 100%;
        margin-top: 40px;
    }
    .baner-image-erh-d345 img{
        max-width: 380px;
    }
    .baner-heading-d345 h2{
        font-size: 26px;
    }
    .baner-span-d345 span{
        font-size: 23px;
        max-width: 100%;
    }
    .baner-para-disc-d345 p{
        font-size: 17px;
        max-width: 100%;
    }
    .baner-button-j43j-d345{
        justify-content: center;
    }
}


/* ========== 480px ========== */
@media (max-width: 480px){
    .baner-cofee-baner-image-flex-44-d345{
        padding: 40px 0px;
    }
    .baner-heading-d345 h2{
        font-size: 22px;
    }
    .baner-span-d345 span{
        font-size: 21px;
    }
    .baner-para-disc-d345 p{
        font-size: 17px;
    }
    .baner-image-erh-d345 img{
        max-width: 280px;
    }
    .button-d345 a,
    .button-irih-d345 a{
        font-size: 13px;
        padding: 10px 20px;
    }
    .baner-button-j43j-d345{
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }
}
</style>

<div class="baner-cofee-main-44-d345">
    <div class="baner-cofee-inner-44-d345">
        <div class="baner-cofee-baner-image-flex-44-d345">
            <div class="baner-text-4jei-d345">
                <div class="baner-heading-d345">
                    <h2>Best Coffee</h2>
                </div>
                <div class="baner-span-d345">
                    <span>Make your day great with our special coffee!</span>
                </div>
                <div class="baner-para-disc-d345">
                    <p>Welcome to our coffee paradise, where every bean tells a story and every cup sparks joy</p>
                </div>
                <div class="baner-button-j43j-d345">
                    <div class="button-d345">
                        <a href="#">Order Now</a>
                    </div>
                    <div class="button-irih-d345">
                        <a href="#">Contact Us</a>
                    </div>
                </div>
            </div>
            <div class="baner-image-erh-d345">
                <img src="coffee-hero-section.png" alt="Coffee">
            </div>
        </div>
    </div>
</div>
