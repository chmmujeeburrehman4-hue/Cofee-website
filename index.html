<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.custom-main-ue4r-d345{
    width: 100%;
}
.custom-inner-ue4r-d345{
    width: 100%;
    max-width: 1300px;
    margin: 0px auto;
}
.custom-header-ue4r-d345{
    width: 100%;
    display: flex;
    align-items: center;
    background-color: #3d0c11;
    min-height: 70px;
    gap: 16px;
}
.logo-cofee-d345{
    width: 36px;
    height: 36px;
    flex-shrink: 0;
}
.logo-cofee-d345 svg{
    width: 36px;
    height: 36px;
}
.logo-cof-text-d345 span{
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    font-family: sans-serif;
    margin-right: auto;
}
.nav-links{
    margin-left: auto;
}
.links-menu{
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 4px;
    align-items: center;
}
.links-menu li{
    list-style: none;
}
.links-menu a{
    color: #ccc;
    text-decoration: none;
    font-family: sans-serif;
    font-size: 15px;
    padding: 7px 18px;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
    display: inline-block;
    cursor: pointer;
}
.links-menu a.active,
.links-menu a:hover{
    background: #e08a1e;
    color: #fff;
}

/* Hamburger Button */
.hamburger-btn-ue4r-d345{
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: none;
    cursor: pointer;
    margin-left: auto;
    width: 36px;
    height: 36px;
}
.hamburger-btn-ue4r-d345 span{
    display: block;
    width: 24px;
    height: 2px;
    background-color: #ffffff;
    border-radius: 2px;
    transition: all 0.3s;
}


/* ========== 1024px ========== */
@media (max-width: 1024px){
    .custom-header-ue4r-d345{
        padding: 14px 0px;
        gap: 12px;
    }
    .links-menu{
        gap: 2px;
    }
    .links-menu a{
        font-size: 14px;
        padding: 7px 14px;
    }
    .logo-cof-text-d345 span{
        font-size: 18px;
    }
}


/* ========== 768px ========== */
@media (max-width: 768px){
    .custom-header-ue4r-d345{
        position: relative;
        flex-wrap: nowrap;
        justify-content: flex-start;
        gap: 10px;
        min-height: 60px;
    }
    .hamburger-btn-ue4r-d345{
        display: flex;
    }
    .nav-links{
        display: none;
        position: absolute;
        top: 60px;
        left: 0px;
        width: 100%;
        background: #2c1810;
        margin-left: 0px;
        z-index: 999;
    }
    .nav-links.open-menu-ue4r-d345{
        display: block;
    }
    .links-menu{
        flex-direction: column;
        align-items: flex-start;
        gap: 0px;
    }
    .links-menu li{
        width: 100%;
        border-bottom: 1px solid #ffffff10;
    }
    .links-menu a{
        display: block;
        width: 100%;
        border-radius: 0px;
        padding: 14px 20px;
        font-size: 15px;
        box-sizing: border-box;
    }
    .logo-cof-text-d345 span{
        font-size: 18px;
    }
}


/* ========== 480px ========== */
@media (max-width: 480px){
    .custom-header-ue4r-d345{
        min-height: 55px;
        gap: 8px;
    }
    .logo-cofee-d345{
        width: 30px;
        height: 30px;
    }
    .logo-cofee-d345 svg{
        width: 30px;
        height: 30px;
    }
    .logo-cof-text-d345 span{
        font-size: 16px;
    }
    .nav-links{
        top: 55px;
    }
    .links-menu a{
        font-size: 14px;
        padding: 13px 16px;
    }
}
</style>

<div class="custom-main-ue4r-d345">
    <div class="custom-inner-ue4r-d345">
        <div class="custom-header-ue4r-d345">
            <div class="logo-cofee-d345">
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="18" cy="18" r="18" fill="#e08a1e" opacity="0.15"/>
                    <path d="M10 14h16v3a8 8 0 01-16 0v-3z" fill="#e08a1e"/>
                    <rect x="24" y="12" width="4" height="6" rx="2" fill="#e08a1e" opacity="0.7"/>
                    <rect x="12" y="25" width="12" height="2" rx="1" fill="#e08a1e" opacity="0.6"/>
                </svg>
            </div>
            <div class="logo-cof-text-d345">
                <span>Coffee</span>
            </div>

            <!-- Hamburger Button -->
            <button class="hamburger-btn-ue4r-d345" id="hamburger-ue4r-d345">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="nav-links-ue4r-d345">
                <div class="links-menu">
                    <li><a href="index.html" class="nav-link active" data-page="home">Home</a></li>
                    <li><a href="About-us-page-1.html" class="nav-link" data-page="about">About</a></li>
                    <li><a href="Menu-page-1.html" class="nav-link" data-page="menu">Menu</a></li>
                    <li><a href="Testimonials-page-slider.html" class="nav-link" data-page="testimonials">Testimonials</a></li>
                    <li><a href="gallery-page.html" class="nav-link" data-page="gallery">Gallery</a></li>
                    <li><a href="contac-us-page-1.html" class="nav-link" data-page="contact">Contact</a></li>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    var hamburger = document.getElementById('hamburger-ue4r-d345');
    var navLinks = document.getElementById('nav-links-ue4r-d345');

    hamburger.addEventListener('click', function(){
        navLinks.classList.toggle('open-menu-ue4r-d345');
    });

    var allLinks = document.querySelectorAll('.nav-link');
    allLinks.forEach(function(link){
        link.addEventListener('click', function(){
            navLinks.classList.remove('open-menu-ue4r-d345');
        });
    });
</script>
